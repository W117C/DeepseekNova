# ── Cargo aliases for DeepseekNova development ────────────────────────
#
# Usage: cargo <alias>   (e.g. `cargo check-all`)

[alias]
check-all   = "check --workspace --all-targets"
test-all    = "test --workspace"
clippy-all  = "clippy --workspace --all-targets -- -D warnings"
doc-all     = "doc --workspace --no-deps --document-private-items"
quickstart  = "run --example quickstart -p deepseeknova-cli"
coverage    = "llvm-cov --workspace"
