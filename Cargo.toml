[workspace]
members = [
    "crates/deepseeknova-cli",
    "crates/deepseeknova-config",
    "crates/deepseeknova-provider",
    "crates/deepseeknova-agent",
    "crates/deepseeknova-tools",
    "crates/deepseeknova-core",
    "crates/deepseeknova-mcp",
    "crates/deepseeknova-event",
    "crates/deepseeknova-graph",
    "crates/deepseeknova-permission",
    "crates/deepseeknova-context",
    "crates/deepseeknova-runtime",
    "crates/deepseeknova-sandbox",
    "crates/deepseeknova-checkpoint",
    "crates/deepseeknova-store",
    "crates/deepseeknova-tui",
    "crates/deepseeknova-serve",
    "crates/deepseeknova-skills",
    "crates/deepseeknova-telemetry",
    "crates/deepseeknova-security",
    "crates/deepseeknova-scanner",
    "crates/deepseeknova-metrics",
]
resolver = "2"
default-members = [
    "crates/deepseeknova-cli",
    "crates/deepseeknova-config",
    "crates/deepseeknova-provider",
    "crates/deepseeknova-agent",
    "crates/deepseeknova-tools",
    "crates/deepseeknova-core",
    "crates/deepseeknova-mcp",
    "crates/deepseeknova-event",
    "crates/deepseeknova-graph",
    "crates/deepseeknova-permission",
    "crates/deepseeknova-context",
    "crates/deepseeknova-runtime",
    "crates/deepseeknova-sandbox",
    "crates/deepseeknova-checkpoint",
    "crates/deepseeknova-store",
    "crates/deepseeknova-tui",
    "crates/deepseeknova-serve",
    "crates/deepseeknova-skills",
    "crates/deepseeknova-telemetry",
    "crates/deepseeknova-security",
    "crates/deepseeknova-scanner",
    "crates/deepseeknova-metrics",
]

[workspace.lints.rust]
rustdoc_broken_intra_doc_links = "deny"
rustdoc_invalid_codeblock_attributes = "deny"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/W117C/DeepseekNova"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_jcs = "0.1"
indexmap = { version = "2.2", features = ["serde"] }
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures-core = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
async-trait = "0.1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
rand = "0.9"
dirs = "6.0"
sha2 = "0.11"
hex = "0.4"
url = "2.5"
ratatui = "0.30"
crossterm = "0.29"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
criterion = { version = "0.8", default-features = false }
serde_yml = "0.0"
walkdir = "2.5"
glob = "0.3"
regex = "1.11"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-sdk = { package = "opentelemetry_sdk", version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry-stdout = { version = "0.32", default-features = false, features = ["trace"] }
tracing-opentelemetry = "0.33"
tempfile = "3.14"

# Internal crates
deepseeknova-agent = { version = "0.4.0", path = "crates/deepseeknova-agent" }
deepseeknova-checkpoint = { version = "0.4.0", path = "crates/deepseeknova-checkpoint" }
deepseeknova-cli = { version = "0.4.0", path = "crates/deepseeknova-cli" }
deepseeknova-config = { version = "0.4.0", path = "crates/deepseeknova-config" }
deepseeknova-context = { version = "0.4.0", path = "crates/deepseeknova-context" }
deepseeknova-core = { version = "0.4.0", path = "crates/deepseeknova-core" }
deepseeknova-event = { version = "0.4.0", path = "crates/deepseeknova-event" }
deepseeknova-graph = { version = "0.4.0", path = "crates/deepseeknova-graph" }
deepseeknova-mcp = { version = "0.4.0", path = "crates/deepseeknova-mcp" }
deepseeknova-metrics = { version = "0.4.0", path = "crates/deepseeknova-metrics" }
deepseeknova-permission = { version = "0.4.0", path = "crates/deepseeknova-permission" }
deepseeknova-provider = { version = "0.4.0", path = "crates/deepseeknova-provider" }
deepseeknova-runtime = { version = "0.4.0", path = "crates/deepseeknova-runtime" }
deepseeknova-sandbox = { version = "0.4.0", path = "crates/deepseeknova-sandbox" }
deepseeknova-scanner = { version = "0.4.0", path = "crates/deepseeknova-scanner" }
deepseeknova-security = { version = "0.4.0", path = "crates/deepseeknova-security" }
deepseeknova-serve = { version = "0.4.0", path = "crates/deepseeknova-serve" }
deepseeknova-skills = { version = "0.4.0", path = "crates/deepseeknova-skills" }
deepseeknova-store = { version = "0.4.0", path = "crates/deepseeknova-store" }
deepseeknova-telemetry = { version = "0.4.0", path = "crates/deepseeknova-telemetry" }
deepseeknova-tools = { version = "0.4.0", path = "crates/deepseeknova-tools" }
deepseeknova-tui = { version = "0.4.0", path = "crates/deepseeknova-tui" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# cargo-dist configuration (v0.27+)
# Install: cargo install cargo-dist
# Generate CI: cargo dist generate-ci
[workspace.metadata.dist]
# Binary crate(s) to produce
cargo-dist-version = "0.28.0"
rust-toolchain-version = "stable"
ci = "github"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# The primary binary
app-name = "deepseeknova-cli"
# Installer configurations
installer = ["shell", "powershell", "npm"]
# MSI not needed; npm covers the widest audience
preferred-installer = "npm"
# Dispatch releases on version tags
publish-jobs = ["tag"]
# Host the artifacts on GitHub Releases
host = "github"
# Don't build for PRs — only tags and manual dispatch
pr-run-mode = "skip"
