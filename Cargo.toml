[workspace]
members = [
    "crates/deepseeknova-cli",
    "crates/deepseeknova-config",
    "crates/deepseeknova-provider",
    "crates/deepseeknova-agent",
    "crates/deepseeknova-tools",
    "crates/deepseeknova-core",
    "crates/deepseeknova-mcp",
    "crates/deepseeknova-event",
    "crates/deepseeknova-graph",
    "crates/deepseeknova-permission",
    "crates/deepseeknova-context",
    "crates/deepseeknova-runtime",
    "crates/deepseeknova-sandbox",
    "crates/deepseeknova-checkpoint",
    "crates/deepseeknova-store",
    "crates/deepseeknova-tui",
    "crates/deepseeknova-serve",
    "crates/deepseeknova-skills",
    "crates/deepseeknova-telemetry",
    "crates/deepseeknova-security",
    "crates/deepseeknova-scanner",
    "crates/deepseeknova-metrics",
]
resolver = "2"
default-members = [
    "crates/deepseeknova-cli",
    "crates/deepseeknova-config",
    "crates/deepseeknova-provider",
    "crates/deepseeknova-agent",
    "crates/deepseeknova-tools",
    "crates/deepseeknova-core",
    "crates/deepseeknova-mcp",
    "crates/deepseeknova-event",
    "crates/deepseeknova-graph",
    "crates/deepseeknova-permission",
    "crates/deepseeknova-context",
    "crates/deepseeknova-runtime",
    "crates/deepseeknova-sandbox",
    "crates/deepseeknova-checkpoint",
    "crates/deepseeknova-store",
    "crates/deepseeknova-tui",
    "crates/deepseeknova-serve",
    "crates/deepseeknova-skills",
    "crates/deepseeknova-telemetry",
    "crates/deepseeknova-security",
    "crates/deepseeknova-scanner",
    "crates/deepseeknova-metrics",
]

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"

[workspace.lints.clippy]
# lint 门控：生产代码禁止 unwrap/expect/panic/unreachable/todo/unimplemented/dbg
# （deny），测试代码允许（各 crate 的 `#![cfg_attr(test, allow(...))]` 豁免）。
# 基线已清理至零警告。
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/W117C/DeepseekNova"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = { version = "2.2", features = ["serde"] }
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures-core = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4.5", features = ["derive"] }
toml = "1.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
rand = "0.9"
dirs = "6.0"
sha2 = "0.11"
hex = "0.4"
url = "2.5"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
criterion = { version = "0.8", default-features = false }
serde_norway = "0.9"
walkdir = "2.5"
glob = "0.3"
regex = "1.11"
rusqlite = { version = "0.40", features = ["bundled"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-sdk = { package = "opentelemetry_sdk", version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry-stdout = { version = "0.32", default-features = false, features = ["trace"] }
tracing-opentelemetry = "0.33"
tempfile = "3.14"
proptest = "1.5"
windows-sys = { version = "0.59", default-features = false }

# Internal crates
deepseeknova-agent = { version = "0.5.0", path = "crates/deepseeknova-agent" }
deepseeknova-checkpoint = { version = "0.5.0", path = "crates/deepseeknova-checkpoint" }
deepseeknova-cli = { version = "0.5.0", path = "crates/deepseeknova-cli" }
deepseeknova-config = { version = "0.5.0", path = "crates/deepseeknova-config" }
deepseeknova-context = { version = "0.5.0", path = "crates/deepseeknova-context" }
deepseeknova-core = { version = "0.5.0", path = "crates/deepseeknova-core" }
deepseeknova-event = { version = "0.5.0", path = "crates/deepseeknova-event" }
deepseeknova-graph = { version = "0.5.0", path = "crates/deepseeknova-graph" }
deepseeknova-mcp = { version = "0.5.0", path = "crates/deepseeknova-mcp" }
deepseeknova-metrics = { version = "0.5.0", path = "crates/deepseeknova-metrics" }
deepseeknova-permission = { version = "0.5.0", path = "crates/deepseeknova-permission" }
deepseeknova-provider = { version = "0.5.0", path = "crates/deepseeknova-provider" }
deepseeknova-runtime = { version = "0.5.0", path = "crates/deepseeknova-runtime" }
deepseeknova-sandbox = { version = "0.5.0", path = "crates/deepseeknova-sandbox" }
deepseeknova-scanner = { version = "0.5.0", path = "crates/deepseeknova-scanner" }
deepseeknova-security = { version = "0.5.0", path = "crates/deepseeknova-security" }
deepseeknova-serve = { version = "0.5.0", path = "crates/deepseeknova-serve" }
deepseeknova-skills = { version = "0.5.0", path = "crates/deepseeknova-skills" }
deepseeknova-store = { version = "0.5.0", path = "crates/deepseeknova-store" }
deepseeknova-telemetry = { version = "0.5.0", path = "crates/deepseeknova-telemetry" }
deepseeknova-tools = { version = "0.5.0", path = "crates/deepseeknova-tools" }
deepseeknova-tui = { version = "0.5.0", path = "crates/deepseeknova-tui" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
