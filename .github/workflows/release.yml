# Release workflow — triggered by version tags (v*)
# Builds and publishes:
#   1. CLI binary (deepseeknova-cli) for 5 platforms (tar.gz/zip + checksums)
#   2. GitHub Release assets consumed by install.sh / install.ps1
#   3. npm package `deepseeknova` (binary downloaded from the release assets;
#      requires NPM_TOKEN secret, otherwise the job is skipped)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── CLI Release Build (5 platforms) ──────────────────────────────
  # NOTE on runner choice:
  #   - macos-15-intel is GitHub's current Intel (x86_64) macOS runner;
  #     macos-latest is already arm64. Use a native Intel runner for
  #     x86_64-apple-darwin (macos-13 was retired).
  #   - ubuntu-24.04-arm is GitHub's native ARM64 Linux runner. The CLI's
  #     dependency tree compiles C code (tree-sitter grammars, rusqlite
  #     bundled SQLite), so cross-compiling aarch64 from x86_64 would need
  #     an aarch64 cross toolchain; a native ARM runner is most reliable.
  cli-release:
    name: CLI release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: deepseeknova-cli
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: deepseeknova-cli
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: deepseeknova-cli
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: deepseeknova-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: deepseeknova-cli.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p deepseeknova-cli

      - name: Package
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/artifacts"
          mkdir -p "$ARTIFACT_DIR"
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "$ARTIFACT_DIR/deepseeknova-cli-${{ matrix.target }}.zip" deepseeknova-cli.exe
          else
            tar czf "$ARTIFACT_DIR/deepseeknova-cli-${{ matrix.target }}.tar.gz" deepseeknova-cli
          fi
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseeknova-cli-${{ matrix.target }}
          path: ${{ env.ARTIFACT_DIR }}/deepseeknova-cli-${{ matrix.target }}.*

  # ── GitHub Release (publish artifacts) ──────────────────────────
  publish:
    name: Create GitHub Release
    needs: [cli-release]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.cli-release.result == 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Generate SHA256 checksums
        run: |
          cd /tmp/artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # tag push → inputs.version 未定义，用 github.ref_name（v0.5.0）；
          # workflow_dispatch → 用用户填的 version，避免建「Release main」。
          name: Release ${{ inputs.version || github.ref_name }}
          tag_name: ${{ inputs.version || github.ref_name }}
          body: |
            ## DeepseekNova ${{ inputs.version || github.ref_name }}

            ### Downloads
            See artifacts attached to this release.

            ### Install
            One-line install scripts (Linux/macOS `curl | sh`, Windows PowerShell) are described in the [README](README.md).

            ### Checksums
            SHA256 checksums are in checksums.txt attached to this release.

            ### Changes
            See the [CHANGELOG](CHANGELOG.md) for details.
          files: |
            /tmp/artifacts/**/*.tar.gz
            /tmp/artifacts/**/*.zip
            /tmp/artifacts/**/checksums.txt
          draft: true
          prerelease: false

  # ── npm package publish ───────────────────────────────────────────
  # 依赖 release 资产已上传；未配置 NPM_TOKEN 时静默跳过（不阻塞 release）。
  npm-publish:
    name: Publish npm package
    needs: [publish]
    runs-on: ubuntu-latest
    # secrets context 在 job 级 if 中不可用（会报 Unrecognized named-value）；
    # 只在 tag push 时运行本 job，token 是否可用由 Publish 步骤经 env 判断。
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Sync package version with tag
        working-directory: npm/deepseeknova
        if: env.NPM_TOKEN != ''
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Validate package
        working-directory: npm/deepseeknova
        run: |
          node --check install.js
          node --check bin/deepseeknova.js
          npm pack --dry-run
      - name: Publish
        if: env.NPM_TOKEN != ''
        working-directory: npm/deepseeknova
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
