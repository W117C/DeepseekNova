name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

permissions: read-all

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-audit
      - name: Run audit
        # Ignored advisories — see deny.toml [advisories].ignore for per-item rationale.
        # RUSTSEC-2026-0002 (lru <0.16.3): ratatui 0.29 传递依赖无法单独升级，
        # 待升级 ratatui 0.30 后移除。其余清单同 deny.toml。
        run: |
          cargo-audit audit \
            --ignore RUSTSEC-2026-0002  \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0068

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-deny
      - name: Run cargo deny
        run: cargo deny check
