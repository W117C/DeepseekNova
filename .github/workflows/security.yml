name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

permissions: read-all

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.85.7
        with:
          tool: cargo-audit
      - name: Run audit
        # Ignored advisories — see deny.toml [advisories].ignore for per-item rationale.
        # 清单与 deny.toml 保持一致；ratatui 0.30 已消除 lru/paste 两项豁免。
        run: |
          cargo-audit audit \
            --ignore RUSTSEC-2025-0068

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.85.7
        with:
          tool: cargo-deny
      - name: Run cargo deny
        run: cargo deny check
