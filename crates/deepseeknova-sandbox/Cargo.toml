edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/deepseeknova-sandbox"
description = "Sandbox trait and platform-specific sandbox implementations"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
