[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = []
# Known transitive/target-specific version forks — no workspace-level upgrade can
# merge these without upstream breaking changes. Review quarterly.
skip = [
    # getrandom: 0.2 via ring/rustls, 0.3 via rand 0.9, 0.4 via tempfile.
    { name = "getrandom", version = "0.2.17" },
    { name = "getrandom", version = "0.3.4" },
    { name = "getrandom", version = "0.4.3" },

    # hashbrown: 0.16 via ratatui-core/kasuari, 0.17 via rusqlite/indexmap/serde_json.
    { name = "hashbrown", version = "0.16.1" },
    { name = "hashbrown", version = "0.17.1" },

    # r-efi: UEFI-target-only crates pulled in by rustix/getrandom; unrelated to host builds.
    { name = "r-efi", version = "5.3.0" },
    { name = "r-efi", version = "6.0.0" },

    # syn: 2 via darling (ratatui) + displaydoc (url/idna), 3 via async-trait + clap_derive.
    { name = "syn", version = "2.0.118" },
    { name = "syn", version = "3.0.3" },

    # windows-sys: 0.52 via ring, 0.61 via clap/anstream.
    { name = "windows-sys", version = "0.52.0" },
    { name = "windows-sys", version = "0.61.2" },
]

[advisories]
version = 2
# 评估 unsound 类公告：默认 cargo-deny 不扫描该类；与 CI cargo-audit（含
# unsound）口径对齐后 ignore 才有实际意义。
unsound = "all"
# Review quarterly — remove items when upstream upgrades resolve them.
# Each entry below has a comment explaining why it's ignored.
ignore = [
    # (empty) — RUSTSEC-2025-0068 (serde_yml) removed 2026-08-10 after
    # migrating to serde_norway (maintained fork).
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
