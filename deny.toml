[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = []
skip = []

[advisories]
version = 2
# Review quarterly — remove items when upstream upgrades resolve them.
# Each entry below has a comment explaining why it's ignored.
ignore = [
    # RUSTSEC-2024-0436: paste 1.0.15 unmaintained — used by ratatui.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2025-0068: serde_yml 0.0.13 — transitive dep, no direct usage.
    "RUSTSEC-2025-0068",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
